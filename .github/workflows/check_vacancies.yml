name: Check hh.uz data analytics vacancies

on:
  schedule:
    # Har 5 daqiqada ishga tushadi (UTC vaqti bo'yicha)
    - cron: "*/57 * * * *"
  workflow_dispatch: {}  # GitHub saytida qo'lda ishga tushirish uchun

concurrency:
  # Agar oldingi run hali tugamagan bo'lsa, yangisi u bilan bir vaqtda
  # ishlab, seen_ids.json'ga yozish/git push paytida to'qnashib qolmasligi
  # uchun navbatga qo'yiladi (bekor qilinmaydi).
  group: check-vacancies
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Vakansiyalarni tekshirish va Telegramga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_vacancies.py

      - name: seen_ids.json va last_run.json holatini repo'ga saqlash
        run: |
          git config user.name "hh-vacancy-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json last_run.json

          # last_run.json har run'da o'zgaradi (ichida vaqt bor), shuning
          # uchun bu yerda deyarli har doim commit qilinadi — bu ataylab
          # shunday: "run bo'lgan-bo'lmaganini" keyin repo tarixidan bilish
          # mumkin bo'lishi uchun (hatto yangi vakansiya topilmasa ham).
          if git diff --staged --quiet; then
            echo "Hech narsa o'zgarmadi, commit shart emas."
            exit 0
          fi
          git commit -m "Update run status"

          # Push paytida boshqa commit (masalan sizning qo'lda tahriringiz)
          # orada kirib qolsa, oddiy 'git push' rad etilishi mumkin.
          # Shu sababli push muvaffaqiyatsiz bo'lsa, avval rebase qilib,
          # keyin qayta urinamiz (jami 5 marta).
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push muvaffaqiyatsiz ($i/5) — sync qilib qayta urinilmoqda..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; break; }
            sleep 3
          done
          echo "Push bir necha urinishdan keyin ham muvaffaqiyatsiz bo'ldi."
          exit 1
