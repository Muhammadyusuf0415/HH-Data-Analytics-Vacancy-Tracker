name: Check hh.uz data analytics vacancies

on:
  schedule:
    # Har 15 daqiqada ishga tushadi (UTC vaqti bo'yicha).
    # Eslatma: avval "*/5" edi (har 5 daqiqa), bu hh.uz'ga juda tez-tez
    # so'rov yuborib, ba'zan vaqtincha bloklanishga (connection timeout)
    # sabab bo'lgan bo'lishi mumkin. 15 daqiqa freshness va barqarorlik
    # o'rtasida yaxshiroq muvozanat.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # GitHub saytida qo'lda ishga tushirish uchun

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # skript osilib qolsa, job cheksiz kutmasin
    # Ikkita run bir vaqtda ishlab ketmasligi uchun (aks holda ikkalasi
    # ham seen_ids.json'ni bir-biridan bexabar o'zgartirib, git push
    # to'qnashuviga va oqibatda "eski vakansiya qayta yuborilishi"ga olib
    # kelishi mumkin edi). Navbatdagi run avvalgisi tugaguncha kutadi.
    concurrency:
      group: check-vacancies
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Vakansiyalarni tekshirish va Telegramga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_vacancies.py

      - name: seen_ids.json holatini repo'ga saqlash
        run: |
          git config user.name "hh-vacancy-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json
          git diff --staged --quiet && exit 0
          git commit -m "Update seen vacancy ids"
          # Push vaqtida remote'da yangiroq commit bo'lib qolishi mumkin
          # (masalan, boshqa bir run tezroq push qilgan bo'lsa) — shu
          # sababli avval rebase qilib, so'ng push qilamiz, kerak bo'lsa
          # bir necha marta qayta urinamiz.
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "Push muvaffaqiyatsiz, qayta urinilmoqda ($i)..."
            sleep 5
          done
