name: Check hh.uz data analytics vacancies

on:
  schedule:
    # Har 15 daqiqada ishga tushadi (UTC vaqti bo'yicha).
    # Eslatma: avval "*/5" edi (har 5 daqiqa), bu hh.uz'ga juda tez-tez
    # so'rov yuborib, ba'zan vaqtincha bloklanishga (connection timeout)
    # sabab bo'lgan bo'lishi mumkin. 15 daqiqa freshness va barqarorlik
    # o'rtasida yaxshiroq muvozanat.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # GitHub saytida qo'lda ishga tushirish uchun

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # skript osilib qolsa, job cheksiz kutmasin
    permissions:
      contents: write
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Vakansiyalarni tekshirish va Telegramga yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_vacancies.py

      - name: seen_ids.json holatini repo'ga saqlash
        run: |
          git config user.name "hh-vacancy-bot"
          git config user.email "actions@github.com"
          git add seen_ids.json
          git diff --staged --quiet || git commit -m "Update seen vacancy ids"
          git push
